<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found | Moscath Garden Apartments</title>
  <meta name="description" content="The page you were looking for could not be found. Return to Moscath Garden Apartments to browse our luxury short-let apartments in Lekki, Lagos." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://moscath.com/404" />

  <!-- Manifest & theme -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#b8964e" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/style.css" />

  <style>
    /* Minimal 404 page styles */
    body {
      background: var(--charcoal, #1a1a18);
      color: var(--ivory, #f5f0e8);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .err-eyebrow {
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #b8964e;
      margin-bottom: 1.5rem;
      display: block;
    }

    .err-heading {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(4rem, 12vw, 9rem);
      font-weight: 300;
      line-height: 1;
      color: #f5f0e8;
      margin-bottom: 1rem;
      opacity: 0.15;
    }

    .err-message {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      color: #f5f0e8;
      margin-bottom: 1rem;
    }

    .err-body {
      font-size: 0.9rem;
      color: rgba(245, 240, 232, 0.5);
      max-width: 420px;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }

    .err-cta {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.9rem 2.2rem;
      background: #b8964e;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 300ms;
      min-height: 48px;
    }

    .err-cta:hover,
    .err-cta:focus-visible {
      background: #a0833e;
      outline: 2px solid #b8964e;
      outline-offset: 3px;
    }

    .err-divider {
      width: 40px;
      height: 1px;
      background: #b8964e;
      margin: 2rem auto;
    }
  </style>
</head>
<body>
  <main>
    <span class="err-eyebrow">Error 404</span>
    <p class="err-heading" aria-hidden="true">404</p>
    <h1 class="err-message">Page not found</h1>
    <div class="err-divider" aria-hidden="true"></div>
    <p class="err-body">
      The page you were looking for does not exist or has been moved.
      Return home to explore our luxury short-let apartments in Lekki, Lagos.
    </p>
    <a href="/" class="err-cta">
      &#8592; Back to Moscath
    </a>
  </main>
</body>
</html>
